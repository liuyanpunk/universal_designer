# Airflow 3.x orchestration suite (FLOW-2 demo pack, per dq.platform/flow-meta/v1 spec)
# Facts: airflow.sdk stable API (Airflow 3.0 release notes); full registration of standard provider
# operators/sensors (operators: bash/python/branch/datetime/weekday/empty/email/latest_only/trigger_dagrun/smooth/hitl;
# sensors: file/time/time_delta/date_time/external_task/python/bash/weekday) + common.sql 7 types
# + http 2 types. TaskGroup is the official group-block mechanism (airflow.sdk.TaskGroup);
# Group failure notice = EmailOperator(trigger_rule="one_failed") outside the group, group >> notify edge — fires on any member failure.
# Usage: pick this file via the FLOW-2 tab "Upload Suite YAML", or copy-edit this file and upload —
# parsing, registration and rendering all happen in the browser, zero backend calls; semantic correctness is the file author's responsibility.
apiVersion: dq.platform/flow-meta/v1
kind: FlowGrammar
metadata: { name: airflow-3x, version: 3, owner: suite-demo }
spec:
  direction: any
  cycle:
    allowed: false          # Airflow DAGs are acyclic
    allowBackEdge: false
    foldOnEmit: []
    maxIterations: 1
    allowWaitNodeInCycle: false
  degree:
    in: [0, 8]
    out: [0, 8]
  group:
    allowed: true
    notify: true
    description: TaskGroup grouping; member failure notice is synthesized as an EmailOperator(trigger_rule="one_failed") outside the group
    fields:
      tooltip: { type: string, title: Tooltip, description: TaskGroup tooltip shown in the UI grid }
      prefix_group_id: { type: boolean, title: Prefix Group ID, description: Prefix member task_ids with the group id (Airflow default true) }
      doc_md: { type: string, title: Doc (Markdown), description: Markdown documentation for the group }
      default_args: { type: string, title: Default Args, format: expr, description: TaskGroup-level default_args dict expression; overrides Dag-level default_args (dags.html TaskGroups) }
  edge:
    description: Edge = task dependency: downstream fires after upstream success; no cycles in this grammar
    fields:
      condition: { type: string, title: Edge Label Condition, description: Non-empty emits Label(...) on the edge (airflow.sdk.Label, dags.html Edge Labels); readback maps Label back here }
  # Common task fields (airflow.sdk.BaseOperator) merged into every node form (v2.0, design doc section 33):
  # a node-level same-name declaration wins over the common one. Facts: task-sdk BaseOperator signature
  # page + dags.html (3.3.2 stable). v2.1 gap-audit vs task-sdk 1.3.2 added the alerting (email*),
  # executor/resources, doc_*, lineage (inlets/outlets) and setup/teardown surface; sla stays as a marked
  # deprecated stub. The UI folds this block per node to avoid a field wall.
  commonForm:
    owner: { type: string, title: Owner, description: Task owner shown in the UI }
    retries: { type: number, title: Retries, description: Retry count before failure (absent = engine default) }
    retry_delay: { type: string, title: Retry Delay, format: expr, description: timedelta or seconds between retries }
    retry_exponential_backoff: { type: boolean, title: Retry Exponential Backoff, description: Growing retry_delay up to max_retry_delay }
    max_retry_delay: { type: string, title: Max Retry Delay, format: expr, description: Backoff cap as timedelta }
    retry_policy: { type: string, title: Retry Policy, format: expr, description: RetryPolicy(...) — 3.x addition; mutually exclusive with retries/retry_delay }
    execution_timeout: { type: string, title: Execution Timeout, format: expr, description: Max runtime per attempt as timedelta }
    trigger_rule: { type: enum, title: Trigger Rule, options: [all_success, all_failed, all_done, all_done_setup_success, all_done_min_one_success, all_skipped, one_failed, one_success, one_done, none_failed, none_failed_min_one_success, none_skipped, always], description: Dependency rule over upstream states (13 values per dags.html 3.3.2) }
    depends_on_past: { type: boolean, title: Depends On Past, description: Instance depends on the same task's previous run }
    wait_for_downstream: { type: boolean, title: Wait For Downstream, description: Previous run's downstream must finish first }
    do_xcom_push: { type: boolean, title: XCom Push, description: Push the return value to XCom (Airflow default true) }
    map_index_template: { type: string, title: Map Index Template, description: Jinja template naming mapped instances }
    task_display_name: { type: string, title: Display Name, description: UI label overriding task_id }
    pool: { type: string, title: Pool, description: Pool name limiting concurrency }
    pool_slots: { type: number, title: Pool Slots, description: Pool slots consumed (Airflow default 1) }
    queue: { type: string, title: Queue, description: Worker queue name }
    priority_weight: { type: number, title: Priority Weight, description: Scheduler priority weight (Airflow default 1) }
    weight_rule: { type: enum, title: Weight Rule, options: [downstream, upstream, absolute], description: Effective-weight aggregation rule }
    max_active_tis_per_dag: { type: number, title: Max Active TIs per DAG, description: Concurrency cap within the DAG }
    max_active_tis_per_dagrun: { type: number, title: Max Active TIs per Run, description: Concurrency cap within one run }
    params: { type: string, title: Params, format: expr, description: Task-level params dict expression }
    on_execute_callback: { type: string, title: On Execute Callback, format: pyref, description: Callable right before execute() }
    on_success_callback: { type: string, title: On Success Callback, format: pyref, description: Callable on success }
    on_failure_callback: { type: string, title: On Failure Callback, format: pyref, description: Callable on failure }
    on_retry_callback: { type: string, title: On Retry Callback, format: pyref, description: Callable on retry }
    on_skipped_callback: { type: string, title: On Skipped Callback, format: pyref, description: Callable when skipped }
    # --- Extended BaseOperator surface (v2.1 gap-audit vs task-sdk 1.3.2): alerting, executor, docs, lineage, setup/teardown ---
    email: { type: string, title: Email, format: pylist, description: Alert recipient addresses, comma-separated, emitted as a Python list }
    email_on_failure: { type: boolean, title: Email On Failure, description: Send alert email when the task fails (Airflow default true) }
    email_on_retry: { type: boolean, title: Email On Retry, description: Send alert email when the task is retried (Airflow default true) }
    sla: { type: string, title: SLA, format: expr, description: timedelta SLA — DEPRECATED stub in 3.0 (warns only); prefer the Dag-level deadline field }
    executor: { type: string, title: Executor, description: Executor name override for this task (multi-executor scheduling, 3.x) }
    executor_config: { type: string, title: Executor Config, format: expr, description: Executor-specific config dict (e.g. KubernetesExecutor pod override) }
    resources: { type: string, title: Resources, format: expr, description: Resource dict such as {"cpus": 2, "ram": 4096} for resource-aware executors }
    run_as_user: { type: string, title: Run As User, description: OS user the task process impersonates }
    doc: { type: string, title: Doc (Plain), description: Plain-text task documentation shown in the UI }
    doc_md: { type: code, title: Doc (Markdown), description: Markdown task documentation shown in the UI }
    doc_json: { type: string, title: Doc (JSON), description: JSON task documentation }
    doc_yaml: { type: string, title: Doc (YAML), description: YAML task documentation }
    doc_rst: { type: string, title: Doc (reStructuredText), description: reStructuredText task documentation }
    pre_execute: { type: string, title: Pre Execute, format: pyref, description: Callable invoked right before execute() }
    post_execute: { type: string, title: Post Execute, format: pyref, description: Callable invoked right after execute() }
    inlets: { type: string, title: Inlets, format: expr, description: Lineage inlets, e.g. [Asset("s3://bucket/in")] — auto-emits the Asset import }
    outlets: { type: string, title: Outlets, format: expr, description: Lineage outlets, e.g. [Asset("s3://bucket/out")] — auto-emits the Asset import }
    start_date: { type: string, title: Start Date, format: expr, description: Task-level start_date override (usually set via Dag default_args) }
    end_date: { type: string, title: End Date, format: expr, description: Task-level end_date override }
    wait_for_past_depends_before_skipping: { type: boolean, title: Wait Past Depends Before Skipping, description: Gate skipping on the previous run state (Airflow 3 default true) }
    ignore_first_depends_on_past: { type: boolean, title: Ignore First Depends On Past, description: Ignore depends_on_past for the first task instance (Airflow 3 default true) }
    render_template_as_native_obj: { type: boolean, title: Native Template Rendering, description: Task-level override of the Dag-level native-render setting }
    logger_name: { type: string, title: Logger Name, description: Custom logger name for task logs }
    allow_nested_operators: { type: boolean, title: Allow Nested Operators, description: Permit nested operator instantiation inside this task scope (setup/teardown contexts) }
    _setup_teardown: { type: enum, title: Setup / Teardown, options: [setup, teardown], description: Mark as setup or teardown task (3.x); renders .as_setup()/.as_teardown() — teardown pairs with its upstream setup }
  # DAG-level config surface (airflow.sdk.DAG kwargs; facts: dags.html 3.3.2 + task-sdk API page).
  # Rendered on the canvas empty-selection panel; emitted through the skeleton dag._argsTxt channel.
  # The parserJs mapping table (DAG_FIELDS) must stay key-identical to this section — author duty.
  # start_date/catchup carry defaults so a fresh canvas emits a schedulable header out of the box.
  dagFields:
    start_date: { type: string, title: Start Date, format: expr, default: _dq_dt.datetime(2026, 1, 1), description: First logical date; default matches the skeleton _dq_dt datetime alias import }
    catchup: { type: boolean, title: Catchup, default: 'false', description: Backfill missed runs between start_date and now (suite boilerplate parity False) }
    end_date: { type: string, title: End Date, format: expr, description: Last logical date }
    is_paused_upon_creation: { type: boolean, title: Paused Upon Creation, description: Create the DAG in paused state }
    tags: { type: string, title: Tags, format: pylist, description: Comma-separated UI filter tags emitted as a Python list }
    description: { type: string, title: Description, description: DAG description shown in the UI }
    doc_md: { type: code, title: Doc (Markdown), description: Markdown docs shown in the grid view }
    default_args: { type: string, title: Default Args, format: expr, description: Task-level defaults dict expression }
    params: { type: string, title: Params, format: expr, description: DAG-level params dict driving the trigger form }
    max_active_tasks: { type: number, title: Max Active Tasks, description: Concurrent task instances across the DAG }
    max_active_runs: { type: number, title: Max Active Runs, description: Active DAG runs cap }
    max_consecutive_failed_dag_runs: { type: number, title: Max Consecutive Failed Runs, description: Auto-pause after N consecutive failed runs (3.x) }
    dagrun_timeout: { type: string, title: Run Timeout, format: expr, description: timedelta cap per DAG run }
    on_success_callback: { type: string, title: On Success Callback, format: pyref, description: Callable on DAG run success }
    on_failure_callback: { type: string, title: On Failure Callback, format: pyref, description: Callable on DAG run failure }
    render_template_as_native_obj: { type: boolean, title: Native Template Rendering, description: Render templates to native Python objects }
    template_searchpath: { type: string, title: Template Searchpath, format: expr, description: Extra Jinja template lookup paths }
    jinja_environment_kwargs: { type: string, title: Jinja Env Kwargs, format: expr, description: jinja2.Environment options dict }
    access_control: { type: string, title: Access Control, format: expr, description: DAG-level permission dict }
    deadline: { type: string, title: Deadline, format: expr, description: DeadlineAlert(...) expression — 3.1+ run-deadline alerting }
    dag_display_name: { type: string, title: Display Name, description: UI display name overriding dag_id (3.x) }
    fail_fast: { type: boolean, title: Fail Fast, description: Fail the whole run as soon as any task fails (3.x) }
    owner_links: { type: string, title: Owner Links, format: expr, description: Owner-to-URL dict, e.g. {"data": "https://wiki/team"} — owners must exist in default_args/task owner }
    user_defined_macros: { type: string, title: User Defined Macros, format: expr, description: Dict of extra variables injected into Jinja templates }
    user_defined_filters: { type: string, title: User Defined Filters, format: expr, description: Dict of custom Jinja filters }
    template_undefined: { type: string, title: Template Undefined, format: pyref, description: jinja2.Undefined subclass controlling undefined-template-variable behavior }
    auto_register: { type: boolean, title: Auto Register, description: Register the DAG when its module is imported (3.x, default true) }
    allowed_run_types: { type: string, title: Allowed Run Types, format: expr, description: Restrict permitted run types, e.g. [DagRunType.SCHEDULED] (3.1+) }
    disable_bundle_versioning: { type: boolean, title: Disable Bundle Versioning, description: Opt out of Dag-bundle versioning (3.x) }
    rerun_with_latest_version: { type: boolean, title: Rerun With Latest Version, description: Re-run tasks with the latest bundle code version (3.x) }
    _emit_asset_import: { type: boolean, title: Emit Asset Import, description: Emit "from airflow.sdk import Asset" in the header — enable when schedule uses __raw__Asset(...) (task outlets/inlets auto-emit it) }
---
# ============ standard provider · operators ============
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: PythonOperator, version: 2 }
spec:
  invocation: atomic
  managed: true
  color: violet
  category: Airflow/Scripts
  description: Invoke a Python callable for task logic. Docs - https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/operators/python.html
  opClass: airflow.providers.standard.operators.python.PythonOperator
  form:
    python_callable: { type: string, title: Callable, format: pyref, required: true, description: Callable reference (module path or imported name) }
    op_args: { type: string, title: Positional Args, format: pylist, description: Comma-separated values emitted as a Python list }
    op_kwargs: { type: string, title: Keyword Args, format: expr, description: Dict expression of keyword args }
    templates_dict: { type: string, title: Templates Dict, format: expr, description: Dict of templated values visible to the callable }
    templates_exts: { type: string, title: Template Exts, format: pylist, description: File extensions resolved as templates }
    show_return_value_in_logs: { type: boolean, title: Log Return Value, description: Log the callable return value (default true) }
    multiple_outputs: { type: boolean, title: Multiple Outputs, description: Return dict unrolled into multiple XCom keys }

---
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: TaskFlowTask, version: 1 }
spec:
  invocation: atomic
  managed: true
  color: teal
  category: Airflow/Scripts
  description: '@task-decorated function (TaskFlow, first-class per dags.html): the def block rides at module level, the invocation line inside the DAG body. Docs - https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/taskflow.html'
  opClass: airflow.taskflow
  match: airflow.decorators.*        # readback wildcard: parserJs tags @task functions as airflow.decorators.<decorator-name> (v1.22: task / task.branch / task.docker … — the decorator identity rides opOverride)
  constants: { _tf: "1" }            # source-carrying marker: emission goes through the _tf nodeRender branch
  form:
    _defSrc: { type: code, title: Function Definition, description: '@task def block emitted before the DAG (deduped); must contain @task and def. Decorator kwargs go here, e.g. @task(retries=2, multiple_outputs=True, queue="heavy")' }
    _callSrc: { type: code, title: Invocation, description: 'Invocation line inside the DAG body, e.g. my_task(), result = my_task(1), or dynamic mapping my_task.expand(x=[1, 2]) / my_task.map(...) — chain suffixes ride verbatim' }

---
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: BashOperator, version: 2 }
spec:
  invocation: atomic
  managed: true
  color: violet
  category: Airflow/Scripts
  description: Run a command in a Bash shell (templated). Docs - https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/operators/bash.html
  opClass: airflow.providers.standard.operators.bash.BashOperator
  form:
    bash_command: { type: code, title: Command, required: true, description: Bash command(s); Jinja-templated }
    env: { type: string, title: Env, format: expr, description: Env vars dict for the subprocess (templated) }
    append_env: { type: boolean, title: Append Env, description: Append env instead of replacing the process environment }
    cwd: { type: string, title: Working Dir, description: Working directory of the subprocess }
    output_encoding: { type: string, title: Output Encoding, description: Encoding of command output (default utf-8) }
    skip_on_exit_code: { type: string, title: Skip On Exit Code, format: expr, description: Exit code or list marking skipped instead of failed (default 99) }
    output_processor: { type: string, title: Output Processor, format: pyref, description: Callable transforming each stdout line before the result is collected }
---
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: BranchPythonOperator, version: 2 }
spec:
  invocation: atomic
  managed: true
  color: cyan
  category: Airflow/Branching
  description: Branch by python_callable return value (task_id or list of task_ids). Docs - https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/operators/python.html
  opClass: airflow.providers.standard.operators.python.BranchPythonOperator
  form:
    python_callable: { type: string, title: Branch Function, format: pyref, required: true, description: Callable returning the task_id(s) to follow }
    op_args: { type: string, title: Positional Args, format: pylist, description: Comma-separated values emitted as a Python list }
    op_kwargs: { type: string, title: Keyword Args, format: expr, description: Dict expression of keyword args }
    templates_dict: { type: string, title: Templates Dict, format: expr, description: Dict of templated values visible to the callable }
    templates_exts: { type: string, title: Template Exts, format: pylist, description: File extensions resolved as templates }
    show_return_value_in_logs: { type: boolean, title: Log Return Value, description: Log the callable return value (default true) }
    multiple_outputs: { type: boolean, title: Multiple Outputs, description: Return dict unrolled into multiple XCom keys }
    ignore_downstream_trigger_rules: { type: boolean, title: Ignore Downstream Trigger Rules, description: Branch selection ignores trigger rules of the skipped siblings (branch-family flag) }
---
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: ShortCircuitOperator, version: 2 }
spec:
  invocation: atomic
  managed: true
  color: cyan
  category: Airflow/Branching
  description: Skip downstream unless the condition holds. Docs - https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/operators/python.html
  opClass: airflow.providers.standard.operators.python.ShortCircuitOperator
  form:
    python_callable: { type: string, title: Judge Function, format: pyref, required: true, description: Callable returning truthy/falsy }
    op_args: { type: string, title: Positional Args, format: pylist, description: Comma-separated values emitted as a Python list }
    op_kwargs: { type: string, title: Keyword Args, format: expr, description: Dict expression of keyword args }
    templates_dict: { type: string, title: Templates Dict, format: expr, description: Dict of templated values visible to the callable }
    templates_exts: { type: string, title: Template Exts, format: pylist, description: File extensions resolved as templates }
    show_return_value_in_logs: { type: boolean, title: Log Return Value, description: Log the callable return value (default true) }
    ignore_downstream_trigger_rules: { type: boolean, title: Ignore Downstream Trigger Rules, description: Respect downstream trigger rules before short-circuiting (default false = respect them) }
---
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: PythonVirtualenvOperator, version: 2 }
spec:
  invocation: atomic
  managed: true
  color: indigo
  category: Airflow/Environments
  description: Run callable in a temporary virtualenv (isolated deps). Docs - https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/operators/python.html
  opClass: airflow.providers.standard.operators.python.PythonVirtualenvOperator
  form:
    python_callable: { type: string, title: Callable, format: pyref, required: true, description: Callable reference }
    requirements: { type: string, title: Requirements, format: pylist, description: Comma-separated pip requirements emitted as a Python list }
    op_args: { type: string, title: Positional Args, format: pylist, description: Comma-separated values emitted as a Python list }
    op_kwargs: { type: string, title: Keyword Args, format: expr, description: Dict expression of keyword args }
    templates_dict: { type: string, title: Templates Dict, format: expr, description: Dict of templated values }
    expect_airflow: { type: boolean, title: Expect Airflow, description: Callable takes an airflow positional arg }
    python_version: { type: string, title: Python Version, description: Python version for the virtualenv, e.g. 3.11 }
    serializer: { type: enum, title: Serializer, options: [pickle, dill, cloudpickle], description: Serialization library for args/return across the venv boundary }
    system_site_packages: { type: boolean, title: System Site Packages, description: Give the venv access to system site-packages (default true) }
    pip_install_options: { type: string, title: Pip Install Options, format: pylist, description: Extra pip CLI flags, e.g. --no-cache-dir }
    index_urls: { type: string, title: Index URLs, format: pylist, description: Package index URLs for requirement resolution }
    index_urls_from_connection_ids: { type: string, title: Index URLs From Connections, format: pylist, description: Connection IDs providing package index URLs }
    venv_cache_path: { type: string, title: Venv Cache Path, description: Directory caching prepared virtualenvs across runs }
    env_vars: { type: string, title: Env Vars, format: expr, description: Environment variable dict for the venv process }
    inherit_env: { type: boolean, title: Inherit Env, description: Inherit the parent process environment (default true) }
    string_args: { type: string, title: String Args, format: pylist, description: op_args entries passed as raw strings, not Python-evaluated }
    templates_exts: { type: string, title: Template Exts, format: pylist, description: File extensions resolved as templates }
    skip_on_exit_code: { type: string, title: Skip On Exit Code, format: expr, description: Exit code or list marking skipped instead of failed }
---
