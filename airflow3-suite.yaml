    templates_dict: { type: string, title: Templates Dict, format: expr, description: Dict of templated values }
    serializer: { type: enum, title: Serializer, options: [pickle, dill, cloudpickle], description: Serialization library for args/return across the interpreter boundary }
    string_args: { type: string, title: String Args, format: pylist, description: op_args entries passed as raw strings, not Python-evaluated }
