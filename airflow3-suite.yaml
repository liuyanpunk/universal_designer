# Airflow 3.x orchestration suite (FLOW-2 demo pack, per dq.platform/flow-meta/v1 spec)
# Facts: airflow.sdk stable API (Airflow 3.0 release notes); full registration of standard provider
# operators/sensors (operators: bash/python/branch/datetime/weekday/empty/email/latest_only/trigger_dagrun/smooth/hitl;
# sensors: file/time/time_delta/date_time/external_task/python/bash/weekday) + common.sql 7 types
# + http 2 types. TaskGroup is the official group-block mechanism (airflow.sdk.TaskGroup);
# Group failure notice = EmailOperator(trigger_rule="one_failed") outside the group, group >> notify edge — fires on any member failure.
# Usage: pick this file via the FLOW-2 tab "Upload Suite YAML", or copy-edit this file and upload —
# parsing, registration and rendering all happen in the browser, zero backend calls; semantic correctness is the file author's responsibility.
apiVersion: dq.platform/flow-meta/v1
kind: FlowGrammar
metadata: { name: airflow-3x, version: 1, owner: suite-demo }
spec:
  direction: any
  cycle:
    allowed: false          # Airflow DAGs are acyclic
    allowBackEdge: false
    foldOnEmit: []
    maxIterations: 1
    allowWaitNodeInCycle: false
  degree:
    in: [0, 8]
    out: [0, 8]
  group:
    allowed: true
    notify: true
    description: TaskGroup grouping; member failure notice is synthesized as an EmailOperator(trigger_rule="one_failed") outside the group
  edge:
    description: Edge = task dependency: downstream fires after upstream success; no cycles in this grammar
    fields:
      condition: { type: string, title: Condition Expression (branch/sensor routing), description: Condition note for branch/sensor routing }
---

