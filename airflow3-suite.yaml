# ============ standard provider · sensors ============
# Sensor common six (BaseSensorOperator, sensors.html): poke_interval / timeout / soft_fail / mode /
# exponential_backoff / max_wait — declared per type because multi-doc YAML anchors cannot cross '---'.
# deferrable is added only where the official docs verify support (time/time_delta/date_time/external_task).
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: FileSensor, version: 2 }
spec:
  invocation: callback               # sensor = waits for external condition
  managed: true
  color: amber
  category: Airflow/Sensors
  description: Poll for file arrival. Docs - https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/sensors/file.html
  opClass: airflow.providers.standard.sensors.file.FileSensor
  form:
    filepath: { type: string, title: File Path, required: true, description: Path (or glob) waited on }
    poke_interval: { type: number, title: Poke Interval (sec), description: Seconds between condition checks }
    timeout: { type: string, title: Timeout, format: expr, description: Seconds or timedelta before timeout }
    soft_fail: { type: boolean, title: Soft Fail, description: Mark skipped instead of failed on timeout }
    mode: { type: enum, title: Mode, options: [poke, reschedule], description: poke holds a worker slot; reschedule frees it between checks }
    exponential_backoff: { type: boolean, title: Exponential Backoff, description: Progressively longer waits between pokes }
    max_wait: { type: string, title: Max Wait, format: expr, description: Max total wait; independent of timeout }
    fs_conn_id: { type: string, title: Filesystem Conn ID, description: Filesystem connection id (default fs_default) }
    recursive: { type: boolean, title: Recursive, description: Enable ** recursive glob matching }
    deferrable: { type: boolean, title: Deferrable, description: Wait in the triggerer via FileTrigger instead of a worker slot }
    start_from_trigger: { type: boolean, title: Start From Trigger, description: Enter the triggerer directly without a first worker poke (3.x) }
    trigger_kwargs: { type: string, title: Trigger Kwargs, format: expr, description: Extra kwargs dict passed to the trigger }
    silent_fail: { type: boolean, title: Silent Fail, description: On poke exception, log and keep poking instead of failing the task (3.x) }
    never_fail: { type: boolean, title: Never Fail, description: Timeouts and sensor errors end the task as success — use with care (3.x) }
---
