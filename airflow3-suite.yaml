      // Scope & nesting guards (v1.16h): construction-scope-only registration.
      // - calls inside helper/callable defs (non-@dag, non-@task_group bodies) are plain function calls, never task nodes
      //   (RawConfigParser inside a python_callable def learned);
      // - calls nested inside another call's argument span are parameter values, never task nodes
      //   (AfterWorkdayTimetable inside DAG(schedule=…) args / DirectoryFileDeleteTrigger inside watcher=[…] args learned);
      // - with-DAG form: classic operator registration only inside the with body.
      const defAt = pos => { let hit = null; F.defs.forEach(d => { if (pos >= d.bodyStart && pos < d.bodyEnd && (!hit || d.bodyStart > hit.bodyStart)) hit = d }); return hit }
      // Factory defs (v1.16i): a plain def CALLED at construction scope contributes its body to construction
      // scope (Airflow runtime executes it inside the DAG context — example_skip_dag's create_test_pipeline
      // learned; contrast: RawConfigParser inside a python_callable helper never runs at construction).
      // Transitive fixpoint: factories calling factories. The factory call statements themselves are owned
      // (consumed by static expansion) so the verbatim carry does not re-execute them at import.
      // (v1.16l) PARAMETERIZED factories are NOT expanded: their bodies bind call-time arguments
      // (create_test_pipeline(suffix, trigger_rule) → task_id=trigger_rule dangles when expanded once).
      // Def + call sites ride verbatim with a warning instead — honest carry beats wrong expansion.
      const factoryFns = {}
      {
        const plainDefs = F.defs.filter(d => !d.decorators.some(de => isTaskDeco(de.name) || isGroupDeco(de.name) || de.name.split('.').pop() === 'dag'))
        const atConstruction = pos => {
          if (dagWith) { if (pos >= dagWith.bodyStart && pos < dagWith.bodyEnd) return true }
          else if (dagDefForScope) { if (pos >= dagDefForScope.bodyStart && pos < dagDefForScope.bodyEnd) return true }
          else if (!defAt(pos)) return true
          const host = defAt(pos)
          return !!(host && factoryFns[host.name])
        }
        const warnedParamFactory = new Set()
        let grew = true
        while (grew) {
          grew = false
          F.calls.forEach(c => {
            const base = c.callee.split('.').pop() === c.callee ? c.callee.split('.')[0] : null
            if (base === null) return
            const d = plainDefs.find(x => x.name === base)
            if (!d || factoryFns[base]) return
            if (!atConstruction(c.start)) return
            if (defParamsOf(d).trim()) {
              if (!warnedParamFactory.has(base)) {
                warnedParamFactory.add(base)
                warnings.push('Parameterized factory ' + base + '(' + defParamsOf(d).trim().slice(0, 40) + ') is not statically expanded: its def and call sites ride verbatim; its tasks are not restored as canvas nodes (call-time parameter binding) — convert to explicit tasks if editing is needed')
              }
              return
            }
            factoryFns[base] = d; grew = true
          })
        }
        F.calls.forEach(c => {
          const base = c.callee.split('.')[0]
          if (!factoryFns[base]) return
          if (inTaskImpl(c.start)) return
          ownStmt(c.start)
          warnings.push('Factory function ' + base + '() call consumed: its task-creating body is statically expanded once; per-call argument variation is not restored (runtime dynamic expansion differs) — verify manually')
        })
      }
      // (v1.16l) a @dag-decorated def counts as construction scope ONLY when it is the converted one —
      // parameterized/non-converted @dag defs are verbatim blocks; registering their inner operator calls
      // owned pieces of an otherwise-carried block and amputated it (example_dag_decorator learned)
      const inNonDagDef = pos => { const d = defAt(pos); if (!d) return false; if (d === dagDefForScope) return false; if (d.decorators.some(de => de.name.split('.').pop() === 'dag')) return true; if (verbatimGroupDefs.has(d)) return true; if (tgFns[d.name] === d) return false; if (factoryFns[d.name] === d) return false; return true }
      const nestedInCall = c => F.calls.some(o => o !== c && o.start <= c.start && c.end <= o.end && (o.start < c.start || o.end > c.end))
      // Converted-scope test (v1.16i): constructs outside the converted DAG's scope are not registered — they
      // belong to a non-converted DAG block (carried verbatim) or to non-construction module space
      const inConvertedScope = pos => {
        const host = defAt(pos)
        if (host && (factoryFns[host.name] === host || tgFns[host.name] === host)) return true // factory/group-factory bodies = construction scope (object identity, collision-proof)
        if (host && host !== dagDefForScope && host.decorators.some(de => de.name.split('.').pop() === 'dag')) return false // a non-converted @dag def body = verbatim ride-along block (v1.16l)
        if (dagWith) return pos >= dagWith.bodyStart && pos < dagWith.bodyEnd
        if (dagDefForScope) return pos >= dagDefForScope.bodyStart && pos < dagDefForScope.bodyEnd
        return true // module-level construction style (dag = DAG(...) assignment)
      }

      // Edge endpoint resolution: variable name -> node id (position-scoped, v1.17); group variables resolve
      // to their path-qualified group id (groupEdgeRewrite is the renderer's job).
      // taskflow fallback: operand is a function name whose decorator declares task_id override — resolve to the override id
      // (example_local_kubernetes_executor learned: @task(task_id="x") def f → chain operand f() means node x, not f)
      const resolve = (n, pos) => {
        const direct = varAt(n, pos) ?? (nodeIds[n] ? n : undefined) ?? (groupVars[n] ? groupVars[n] : undefined)
        if (direct) return direct
      if (taskFns[n]) {
          const deId = lit(taskFns[n].kw.task_id)
          // (v1.17) qualified name first: fn name and decorator task_id override may both collide — try the group-qualified id at the current position before the bare name
          const g = pos !== undefined ? groupAt2(pos) : undefined
          const cands = [deId !== undefined ? String(deId) : undefined, n].filter(Boolean)
          for (const c0 of cands) {
            const q = g ? g + '.' + c0 : String(c0)
            if (nodeIds[q]) return q
            if (nodeIds[String(c0)]) return String(c0)
          }
        }
        return undefined
      }
      const link = (froms, tos, cond) => {
        froms.forEach(f => tos.forEach(t => {
          if (notifyIds.has(f) || notifyIds.has(t)) return
          edges.push({ from: f, to: t, ...(cond !== undefined ? { attrs: { condition: cond } } : {}) })
        }))
      }
      const operandResolve = (operand, ctx, pos) => {
        // (v1.17) chain-operand setup/teardown modifier: task_3.as_teardown(setups=task_1) — the modifier
        // mutates the task in place; resolve the base for wiring and re-emit the modifier verbatim at the
        // DAG tail (bind names survive via _bindVar/userBind, so the carried line stays valid)
        const sufM = operand.match(/^([\s\S]*?)\.(as_setup|as_teardown)\(([\s\S]*)\)\s*$/)
        if (sufM) { modifierLines.push(sufM[1].trim() + '.' + sufM[2] + '(' + sufM[3] + ')'); operand = sufM[1].trim() }
        const r = py.names(operand, F.listVars)
        if (r.label !== undefined) return { names: [], label: r.label } // v1.21: Label maps to the edge condition attr; edgeRender re-emits Label(...)
        const out = []
        r.names.forEach(n => {
          let id = resolve(n, pos)
          if (!id && taskFns[n]) {
            // Zero-arg @task calls used directly as chain operands (e.g. inside (start_task() >> [...])): instantiated immediately.
            // Honor decorator task_id override (operand name != node id when declared)
            // (v1.16l) operand raw may carry call args (inner_teardown(inner_setup_task) — the mechanical layer
            // does not record chain-operand calls in F.calls): keep the full operand text as callSrc so args
            // survive; pass the statement position so group membership resolves; harvest arg references as
            // implicit data-flow edges (example_setup_teardown_taskflow learned: n+'()' dropped args → TypeError)
            const ov = lit(taskFns[n].kw.task_id)
            const callForm = new RegExp('^\\s*' + n + '\\s*\\([\\s\\S]*\\)\\s*$').test(operand)
            id = addNode(undefined, 'airflow.decorators.' + taskFns[n].name, { ...taskFns[n].kw }, pos ?? 0, String(ov ?? n),
              { tf: '1', bare: '1', defSrc: taskFns[n].inBlock ? undefined : taskFns[n].defSrc, defImport: taskFns[n].defImport,
                defInline: taskFns[n].inBlock ? taskFns[n].defSrc : undefined,
                callSrc: callForm ? operand.trim() : n + '()' })
            if (id && callForm) {
              const seenRef2 = new Set()
              ;(operand.match(/\b[A-Za-z_]\w*\b/g) || []).forEach(w => {
                if (w === n) return
                const bw = varAt(w, pos)
                if (bw && bw !== id && !seenRef2.has(w) && !notifyIds.has(bw)) { seenRef2.add(w); edges.push({ from: bw, to: id, attrs: { implicit: '1' } }) }
              })
            }
          }
          if (id) out.push(id)
          else warnings.push('Unresolved chain operand: ' + n + ' (' + ctx.trim().slice(0, 60).replace(/\n/g, ' ') + ')')
        })
        if (!r.names.length && /\w+\(/.test(r.raw)) warnings.push('Unresolved dynamic chain operand: ' + r.raw.trim().slice(0, 60).replace(/\n/g, ' '))
        return { names: out }
      }

      // Node registration (shared by classic + taskflow). forcedId: id already resolved by the caller (taskflow path),
      // must not come back via kw.task_id — kw values are source tokens; re-parsing a resolved id misjudges it as an expression (learned the hard way)
      const tfVars = new Set()
      const addNode = (varName, opFull, kw, start, forcedId, meta) => {
        const idLit = lit(kw.task_id)
        if (!forcedId && kw.task_id !== undefined && idLit === undefined) warnings.push('task_id is a dynamic expression (' + kw.task_id.trim().slice(0, 40) + '); registered under variable name ' + varName + '; each runtime instance differs (factory/loop pattern) — please verify manually')
        const bare = forcedId ?? (idLit !== undefined ? String(idLit) : varName)
        if (!bare) return undefined
        const tr = lit(kw.trigger_rule)
        if (opFull.split('.').pop() === 'EmailOperator' && tr === 'one_failed' && String(bare).endsWith('_notify')) {
          notifyOf[String(bare).slice(0, -7)] = String(lit(kw.to) ?? '')
          notifyIds.add(String(bare))
          nodeIds[String(bare)] = true   // register without node: g1 >> g1_notify endpoint resolvable, excluded at link time per contract
          if (varName) pushBind(varName, String(bare), start)
          return undefined
        }
        const params = {}
        Object.keys(kw).forEach(k => {
          if (k === 'task_id') return
          // (v1.22) strip dag=<var>: the task is re-homed inside the converted DAG's with-block, so a
          // constructor-style dag=my_dag binding re-emitted verbatim dangles (my_dag is never defined in
          // the converted file) — dags.html "Dag Assignment". Membership now comes from the with-block.
          if (k === 'dag') return
          const p = py.param(kw[k])
          if (p !== undefined) params[k] = p
          // pylist-declared keys: a list-of-string-literals kwarg round-trips as a string array (same contract as
          // dagFields lists; the engine listifies arrays at emission — stays a Python list even when the node's
          // type does not declare this key, e.g. wildcard-carried provider operators)
          if (PYLIST_KEYS.has(k) && p && typeof p === 'object' && '__expr' in p) {
            const m2 = String(p.__expr).trim().match(/^\[([\s\S]*)\]$/)
            if (m2) {
              const parts = py.splitArgs(m2[1]).pos.map(s => s.trim()).filter(Boolean)
              const lits = parts.map(x => lit(x))
              if (parts.length && lits.every(x => typeof x === 'string')) params[k] = lits
            }
          }
        })
        // meta: source-carry keys — merged as _-prefixed params (engine convention: never rendered as operator params)
        if (meta) Object.keys(meta).forEach(k => { if (meta[k] !== undefined && meta[k] !== '') params['_' + k] = meta[k] })
        // (v1.17) group membership qualifies the node id to match runtime task_id prefixing — bare ids
        // collide across groups (section_1.task_1 vs section_2.task_1 — example_task_group learned)
        const g = groupAt2(start)
        const id = g ? g + '.' + bare : String(bare)
        // (v1.16l) classic operators keep their original binding variable: task_id and the variable diverge
        // (t1 = BashOperator(task_id="print_date")) and verbatim-carried lines reference the variable
        // (t1.doc_md = … — tutorial.py learned). _bindVar rides params; nodeRender binds it; refOf rewrites edges to it
        if (varName && varName !== id && (!meta || meta.tf !== '1')) params._bindVar = varName
        if (nodeIds[id]) warnings.push('Duplicate task_id: ' + id + ' (check the two definitions manually)')
        nodeIds[id] = true
        if (varName) pushBind(varName, id, start)
        const node = { id, op: opFull, params, __start: start }
        if (g) node.group = g
        nodes.push(node)
        return id
      }

      // Chained taskflow-modifier spans (v1.21, astro exampledag learned): the mechanical layer ends a
      // call at its own paren pair and jumps past it, so fn.partial(...).expand(\n x=fn2()\n) is amputated
      // after .partial(...) — the .expand(...) suffix never becomes a call record, and its continuation-line
      // args masquerade as fresh assignments (person_in_space=get_astronauts() phantom-instantiated, the
      // semantic data-flow edge lost). Compute the true chain span ONCE here (guards identical to the
      // taskflow loop below); every F.calls consumer skips calls starting inside an absorbed span, and the
      // taskflow loop extends its callSrc / arg-harvest to the recorded span.
      const absorbedSpans = []
      F.calls.forEach(c => {
        const base = c.callee.split('.')[0], last = c.callee.split('.').pop()
        if (!taskFns[base]) return
        if (last !== base && !['expand', 'map', 'partial', 'override'].includes(last)) return
        if (inTaskImpl(c.start) || inNonDagDef(c.start) || !inConvertedScope(c.start) || inStZone(c.start)) return
        let cEnd = c.end, chainedArgs = ''
        for (;;) {
          let p2 = cEnd
          while (p2 < text.length && (text[p2] === ' ' || text[p2] === '\t')) p2++
          if (text[p2] === '(') { // modifier result invoked again: fn.partial(...)(...)
            const close2 = py.paren(text, p2)
            if (!(close2 > p2)) break
            chainedArgs += '\n' + text.slice(p2 + 1, close2)
            cEnd = close2 + 1
            continue
          }
          const dm = /^\.(expand|map|partial|override)[ \t]*\(/.exec(text.slice(p2, p2 + 40))
          if (!dm) break
          const openIdx = p2 + dm[0].length - 1
          const close2 = py.paren(text, openIdx)
          if (!(close2 > openIdx)) break
          chainedArgs += '\n' + text.slice(openIdx + 1, close2)
          cEnd = close2 + 1
        }
        if (cEnd > c.end) { c.chainEnd = cEnd; c.chainedArgs = chainedArgs; absorbedSpans.push([c.end, cEnd]) }
      })
      const inAbsorbed = pos => absorbedSpans.some(r => pos > r[0] && pos < r[1])

      // classic operator calls (single-line/multi-line paren blocks, merged by the mechanical layer);
      // calls inside @task implementation bodies are plain function calls — never task nodes
      F.calls.forEach(c => {
        if (!isOpCall(c.callee)) return
        if (inTaskImpl(c.start)) return
        if (inNonDagDef(c.start)) return // helper/callable def bodies: plain calls, not tasks (v1.16h)
        if (nestedInCall(c)) return // parameter values (triggers/timetables/strategies), not tasks (v1.16h)
        if (inAbsorbed(c.start)) { warnings.push('Operator instantiation ' + c.callee.split('.').pop() + '(...) inside taskflow chain args rides verbatim within the chain statement — not restored as a canvas node (v1.21)'); return }
        if (!inConvertedScope(c.start)) { // non-converted DAG blocks ride verbatim (v1.16i)
          // (v1.22) but a ctor-style dag= binding outside the converted scope is worth surfacing: the task
          // exists at runtime yet is invisible on the canvas (dags.html "Dag Assignment")
          if (kwOf(c.argText).kw.dag !== undefined) warnings.push('Operator ' + c.callee.split('.').pop() + '(...) sits outside the converted DAG scope but binds a Dag explicitly (dag=…): rides verbatim, not editable on canvas')
          return
        }
        if (inStZone(c.start)) return // setup/teardown context blocks ride verbatim whole (v1.17)
        ownStmt(c.start)
        if (!c.callee.includes('.') && !F.imports[c.callee]) warnings.push('Operator class ' + c.callee + ' has no import in this file (locally defined or wildcard-imported); its class definition is not carried — emission references the bare name, add the import or class def manually')
        // (v1.17) instantiation-statement setup/teardown suffix: op = BashOperator(...).as_setup() /
        // .as_teardown(setups=...) — the chained modifier follows the ctor call inside the same statement;
        // capture verbatim and append at emission (example_setup_teardown learned: dropping it loses the
        // runtime implicit setup/teardown wiring)
        const stx = stmtOf(c.start)
        const tail = stx ? text.slice(c.end, stx.end).trim() : ''
        const sufM = tail.match(/^\.(as_setup|as_teardown)\(([\s\S]*)\)$/)
        addNode(c.varName, fullOp(c.callee), kwOf(c.argText).kw, c.start, undefined,
          sufM ? { opSuffix: '.' + sufM[1] + '(' + sufM[2] + ')' } : undefined)
      })

      // Instantiation inside loop bodies (for/while ranges from mechanical layer): multiple runtime instances, only one restored statically — surfaced
      const inLoop = pos => F.loops.some(l => pos > l.bodyStart && pos < l.bodyEnd)

      // In-block reference guard (v1.16l, example_kubernetes_executor ×2 learned): a @task def physically
      // located INSIDE the construction scope whose decorator args or body reference scope-local names
      // (in-block dict/constant assignments, helper defs, the with-as dag var) cannot hoist to the module-level
      // defs section — the name only exists inside the with-block, so the hoisted decorator crashes at import
      // (@task(executor_config=start_task_executor_config) → NameError). Such defs keep their original in-block
      // position: emission rides the first instantiation's _defInline slot instead of graph.defs.
      // Scope-locals are collected at TOP level of the scope only — names assigned inside nested def bodies are
      // that def's locals, not scope state (example_task_loops: improve's own `estimate = …` polluted the set);
      // a def's own parameters shadow scope names in its body, so body checks exclude them (decorator args are
      // evaluated at scope level and always checked).
      {
        const scopeS = dagWith ? [dagWith.bodyStart, dagWith.bodyEnd] : dagDefForScope ? [dagDefForScope.bodyStart, dagDefForScope.bodyEnd] : null
        if (scopeS) {
          const scopeHost = dagDefForScope ?? null
          const locals = new Set()
          F.defs.forEach(d => {
            if (d.start < scopeS[0] || d.start >= scopeS[1]) return
            const host = defAt(d.start)
            if (host && host !== scopeHost) return // nested def — its name is not a scope-level binding
            if (!d.decorators.some(de => isTaskDeco(de.name) || isGroupDeco(de.name))) locals.add(d.name)
          })
          F.statements.forEach(st => {
            if (st.start < scopeS[0] || st.start >= scopeS[1]) return
            const host = defAt(st.start)
            if (host && host !== scopeHost) return // inside a nested def body — def-local, not scope state
            const m = /^\s*(\w+)\s*=[^=]/.exec(st.text)
            if (m) locals.add(m[1])
          })
          if (dagWith) { const wm = /\bas\s+(\w+)\s*:/.exec(text.slice(dagWith.start, dagWith.bodyStart)); if (wm) locals.add(wm[1]) }
          Object.keys(taskFns).forEach(n => {
            const t = taskFns[n], d = t.rec
            if (!d || d.start < scopeS[0] || d.start >= scopeS[1]) return // module-level defs hoist safely (modLines precede the defs section)
            const ownParams = new Set(defParamsOf(d).split(',').map(s => { const m2 = /^[\s*]*(\w+)/.exec(s); return m2 ? m2[1] : '' }).filter(Boolean))
            const decoHay = d.decorators.map(de => de.argText).join('\n')
            const bodyHay = text.slice(d.start, d.bodyEnd)
            for (const ln of locals) {
              if (ln === d.name) continue
              if (new RegExp('\\b' + ln + '\\b').test(decoHay)) { t.inBlock = '1'; break }
              if (!ownParams.has(ln) && new RegExp('\\b' + ln + '\\b').test(bodyHay)) { t.inBlock = '1'; break }
            }
          })
        }
      }

      // @task_group call instantiation: no node created, register group variable for chain parsing; loops/multiple calls surfaced (runtime group ids get __N suffix)
      const tgCalled = {}
      F.calls.forEach(c => {
        const base = c.callee.split('.')[0], last = c.callee.split('.').pop()
        if (!tgFns[base]) return
        if (inNonDagDef(c.start)) return // helper def bodies: not group instantiation (v1.16h)
        if (!inConvertedScope(c.start)) return // non-converted DAG blocks ride verbatim (v1.16i)
        if (inStZone(c.start)) return // setup/teardown context blocks ride verbatim whole (v1.17)
        ownStmt(c.start)
        if (last !== base) warnings.push('@task_group call modifier .' + last + '(...) is a runtime expansion directive (dynamic mapping/loop); static readback keeps the group definition only — re-declare the modifier manually if needed')
        if (inLoop(c.start)) warnings.push('@task_group function ' + base + ' instantiated in loop body: runtime group ids expand as ' + base + '__N; static readback restores only one group definition')
        else if (tgCalled[base]) warnings.push('@task_group function ' + base + ' called multiple times: runtime group ids are ' + base + '__N; static readback restores only one group definition')
        tgCalled[base] = true
        if (c.varName) pushBind(c.varName, tgFns[base].__gid ?? base, c.start)
      })

      // taskflow nested-call instantiation: inner calls of task_3(task_2(task_1(value))) are also standalone tasks (recursively expanded)
      const spawnNested = (argText, outerNid, start, depth) => {
        if (depth > 8 || !argText) return
        const re = /([A-Za-z_]\w*)\s*\(/g
        let m
        const hits = []
        while ((m = re.exec(argText))) if (taskFns[m[1]]) hits.push({ fn: m[1], open: argText.indexOf('(', m.index + m[1].length - 1) })
        hits.forEach(h => {
          const close = py.paren(argText, h.open)
          const innerArgs = close > h.open ? argText.slice(h.open + 1, close) : ''
          const a = kwOf(innerArgs)
          let id = lit(a.kw.task_id) ?? lit(taskFns[h.fn].kw.task_id) ?? h.fn
          const gN = groupAt2(start)
          if (nodeIds[gN ? gN + '.' + id : String(id)]) { fnCnt[h.fn] = (fnCnt[h.fn] || 0) + 1; id = h.fn + '__' + fnCnt[h.fn]; warnings.push('@task function ' + h.fn + ' re-instantiated, id suffixed to ' + id) }
          // noCall: nested calls are instantiated by the outer callSrc verbatim — they never emit their own statement
          // (in-block defs: nested prototypes carry neither defSrc nor defInline — the outer emitted node anchors the def, v1.16l)
          const nid = addNode(undefined, 'airflow.decorators.' + taskFns[h.fn].name, { ...taskFns[h.fn].kw, ...a.kw }, start, String(id),
            { tf: '1', noCall: '1', defSrc: taskFns[h.fn].inBlock ? undefined : taskFns[h.fn].defSrc, defImport: taskFns[h.fn].defImport })
          if (!nid) return
          edges.push({ from: nid, to: outerNid, attrs: { implicit: '1' } }) // data-flow edge: implicit in call nesting, never rendered as >>
          spawnNested(innerArgs, nid, start, depth + 1)
        })
      }

      // emission-LHS uniqueness registry (v1.21): varName → first node id; collisions rename the emission LHS only
      const usedTfBind = {}

      // taskflow instantiation: fn() / fn.expand(...) / fn.partial(...) / fn.override(...) at construction scope
      // (inside @task implementation bodies a same-named call is a plain function call — skipped)
      F.calls.forEach(c => {
        const base = c.callee.split('.')[0], last = c.callee.split('.').pop()
        if (!taskFns[base]) return
        if (last !== base && !['expand', 'map', 'partial', 'override'].includes(last)) return
        if (inTaskImpl(c.start)) return
        if (inNonDagDef(c.start)) return // helper def bodies: not taskflow instantiation (v1.16h)
        if (!inConvertedScope(c.start)) return // non-converted DAG blocks ride verbatim (v1.16i)
        if (inStZone(c.start)) return // setup/teardown context blocks ride verbatim whole (v1.17)
        if (inAbsorbed(c.start)) return // inside another chain's absorbed span — nested handling via spawnNested below (v1.21)
        ownStmt(c.start)
        const a = kwOf(c.argText)
        // chained-call absorption (v1.16k same-line invocations; v1.21 dotted modifiers): spans precomputed
        // above — callSrc slices to the chain tail so .expand(...)/.map(...) args survive verbatim, and the
        // chained args join the ref-harvest / nested-call spawn (they carry the data-flow wiring).
        const cEnd = c.chainEnd ?? c.end
        const chainedArgs = c.chainedArgs ?? ''
        let id = lit(a.kw.task_id) ?? lit(taskFns[base].kw.task_id) ?? base
        const gI = groupAt2(c.start)
        if (nodeIds[gI ? gI + '.' + id : String(id)]) { fnCnt[base] = (fnCnt[base] || 0) + 1; id = base + '__' + fnCnt[base]; warnings.push('@task function ' + base + ' re-instantiated, id suffixed to ' + id) }
        if (inLoop(c.start)) warnings.push('@task function ' + base + ' instantiated in loop body: multiple runtime instances (task_id auto-suffixed); only one restored statically')
        // (v1.21, astro example_branch_operator_decorator learned) emission-LHS disambiguation: distinct
        // instantiation statements sharing one bind variable (t = some_task() / t = some_ext_py_task() /
        // t = some_venv_task() across loop bodies) are positionally unambiguous in the SOURCE, but the
        // normalized emission is a flat scope — every edge rewritten to `t` resolves to the LAST binding
        // on re-parse (and at runtime). Rename the emission LHS to a fresh name; pushBind keeps the
        // ORIGINAL varName so source-positional resolution of this parse is untouched.
        let callSrc = dedentSrc(text.slice(c.start, cEnd).replace(/[ \t]+$/gm, ''), c.indent).replace(/^return[ \t]+/, '')
        let renamedBind = ''
        if (c.varName && usedTfBind[c.varName]) {
          let seq = 1, nn = c.varName + '_' + seq
          while (usedTfBind[nn] || nodeIds[nn]) { seq++; nn = c.varName + '_' + seq }
          callSrc = callSrc.replace(/^(\s*)\w+([ \t]*=[^=])/, '$1' + nn + '$2')
          renamedBind = nn
          warnings.push('taskflow bind variable ' + c.varName + ' is rebound by multiple instantiations; emission renamed it to ' + nn + ' so edge references stay unambiguous (runtime loop rebinding is collapsed statically)')
        }
        const nid = addNode(c.varName, 'airflow.decorators.' + taskFns[base].name, { ...taskFns[base].kw, ...a.kw }, c.start, String(id),
          { tf: '1', bare: c.varName ? undefined : '1', defSrc: taskFns[base].inBlock ? undefined : taskFns[base].defSrc, defImport: taskFns[base].defImport,
            defInline: taskFns[base].inBlock ? taskFns[base].defSrc : undefined, // in-block def anchors to its earliest emitted instantiation (v1.16l)
            // return-prefixed instantiation (group factory bodies): the return keyword is def-scope syntax — strip it, the bare call is the emission form
            callSrc })
        if (!nid) return
        if (c.varName) { tfVars.add(c.varName); usedTfBind[c.varName] = nid }
        if (renamedBind) usedTfBind[renamedBind] = nid // the fresh name is taken too — the next rebound instance must step past it
        const seenRef = new Set()
        ;((c.argText + chainedArgs).match(/\b[A-Za-z_]\w*\b/g) || []).forEach(w => {
          // Referencing any registered node variable = dependency (Airflow semantics: referencing an operator instance makes it upstream; string-literal contents are not in byVar, no false links)
          // Data-flow edge: implicit in the call arguments, never rendered as >> (edgeRender if-eq skips implicit)
          const bw = varAt(w, c.start)
          if (bw && bw !== nid && !seenRef.has(w) && !notifyIds.has(bw)) { seenRef.add(w); edges.push({ from: bw, to: nid, attrs: { implicit: '1' } }) }
        })
        spawnNested(c.argText + chainedArgs, nid, c.start, 0)
      })

      // Chain >>/<< ([a,b] fan-out/fan-in; Label passes through unconsumed)
      F.statements.forEach(st => {
        const ch = py.chain(st.text)
        if (!ch) return
        if (inNonDagDef(st.start)) return // chains inside helper defs are not task wiring (v1.16h)
        if (!inConvertedScope(st.start)) return // non-converted DAG blocks ride verbatim (v1.16i)
        if (inStZone(st.start)) return // setup/teardown context blocks ride verbatim whole (v1.17)
        // (v1.16m) resolve BEFORE owning: a chain with unresolvable operands rides verbatim. Partial
        // registration created no edges yet still owned the statement, so the mixed-block guard dropped
        // the surrounding control flow (example_task_group_decorator learned: start_task >>
        // current_task_group >> end_task inside a loop-instantiated parameterized-group for-block).
        const resolved = []
        for (let i = 0; i <= ch.ops.length; i++) resolved.push(operandResolve(ch.operands[i] || '', st.text, st.start))
        if (resolved.some((r, i) => !r.skip && r.label === undefined && !(r.names && r.names.length) && (ch.operands[i] || '').trim())) {
          warnings.push('Chain operand(s) unresolvable — the chain rides verbatim, wiring not editable on canvas: ' + st.text.trim().slice(0, 80).replace(/\n/g, ' '))
          return
        }
        ownedStmts.push([st.start, st.end])
        // (v1.21) Label operands do not resolve to nodes: the label text becomes the condition attr of the
        // edge that skips over it (a >> Label("x") >> b → a >> b {condition: x}); a dangling Label warns (P1)
        let pending = null, pendingLabel = undefined
        for (let i = 0; i <= ch.ops.length; i++) {
          const cur = resolved[i]
          if (cur.skip) continue
          if (cur.label !== undefined) { pendingLabel = cur.label; continue }
          if (pending && ch.ops[i - 1]) {
            if (ch.ops[i - 1] === '>>') link(pending.names, cur.names, pendingLabel)
            else link(cur.names, pending.names, pendingLabel)
            pendingLabel = undefined
          }
          pending = cur
        }
        if (pendingLabel !== undefined) warnings.push('Label("' + pendingLabel + '") could not attach to an edge (no resolvable pair around it); dropped')
      })

      // chain() / chain_linear() / cross_downstream() / set_downstream / set_upstream
      F.calls.forEach(c => {
        if (inNonDagDef(c.start)) return // helper def bodies: not task wiring (v1.16h)
        if (!inConvertedScope(c.start)) return // non-converted DAG blocks ride verbatim (v1.16i)
        if (inStZone(c.start)) return // setup/teardown context blocks ride verbatim whole (v1.17)
        const last = c.callee.split('.').pop()
        if (last === 'chain' || last === 'chain_linear') {
          if (last === 'chain_linear') warnings.push('chain_linear expanded as adjacent-pairs approximation — please verify manually')
          const a = kwOf(c.argText)
          const seq = [] // entries: { names, list } — list = operand was syntactically […]/(…) (Airflow's ValueError/zip rules key on list-ness, not element count)
          const lvHit = []
          a.pos.forEach(p => {
            const t = p.trim()
            if (t.startsWith('*')) {
              const v = F.listVars[t.slice(1)]
              if (v) { lvHit.push(t.slice(1)); v.forEach(n => { const id = resolve(n, c.start); if (id) seq.push({ names: [id], list: false }); else warnings.push('Unresolved chain list item: ' + n) }) }
              else warnings.push('chain(*' + t.slice(1) + ') expansion failed: list variable not found')
              return
            }
            const r = operandResolve(t, c.argText, c.start)
            if (r.label !== undefined) warnings.push('Label("' + r.label + '") inside chain() is not carried; attach the label as an edge condition on canvas instead')
            if (r.names.length) seq.push({ names: r.names, list: /^[[(]/.test(t) })
          })
          // (v1.22) dags.html "Chain": adjacent lists of EQUAL length pair up element-wise (zip), never
          // cross; different-length lists raise ValueError at Airflow parse time — ride verbatim instead
          // of fabricating edges. chain_linear keeps adjacent cross-product (its documented semantics).
          if (last === 'chain') {
            for (let i = 0; i + 1 < seq.length; i++) {
              if (seq[i].list && seq[i + 1].list && seq[i].names.length !== seq[i + 1].names.length) {
                warnings.push('chain() with different-length lists raises ValueError in Airflow — statement rides verbatim; fix the group lengths or rewrite as plain >> edges')
                return
              }
            }
          }
          ownStmt(c.start)
          lvHit.forEach(v => expandedListVars.add(v))
          for (let i = 0; i + 1 < seq.length; i++) {
            const A = seq[i], B = seq[i + 1]
            if (last === 'chain' && A.list && B.list && A.names.length > 1) { for (let k = 0; k < A.names.length; k++) link([A.names[k]], [B.names[k]]) }
            else link(A.names, B.names)
          }
        }
        if (last === 'cross_downstream') {
          // (v1.22) dags.html "Task Dependencies": cross_downstream(from_tasks, to_tasks) wires the full
          // cross product from every upstream to every downstream task
          const a = kwOf(c.argText)
          if (a.pos.length < 2) { warnings.push('cross_downstream() needs two task lists; found ' + a.pos.length + ' operand(s) — statement rides verbatim'); return }
          const froms = [], tos = []
          const r1 = operandResolve(a.pos[0].trim(), c.argText, c.start)
          const r2 = operandResolve(a.pos[1].trim(), c.argText, c.start)
          if (r1.label !== undefined || r2.label !== undefined) warnings.push('Label() inside cross_downstream() is not carried; attach the label as an edge condition on canvas instead')
          r1.names.forEach(n => froms.push(n)); r2.names.forEach(n => tos.push(n))
          if (!froms.length || !tos.length) { warnings.push('cross_downstream() operands unresolved — statement rides verbatim'); return }
          ownStmt(c.start)
          link(froms, tos)
        }
        if (last === 'set_downstream' || last === 'set_upstream') {
          ownStmt(c.start)
          const base = c.callee.slice(0, c.callee.length - last.length - 1)
          const src = resolve(base, c.start)
          if (!src) { warnings.push(last + ' source unresolved: ' + base); return }
          const tgts = []
          kwOf(c.argText).pos.forEach(p => { const r = operandResolve(p, c.argText, c.start); if (r.label !== undefined) warnings.push('Label("' + r.label + '") in ' + last + '() is not carried; attach the label as an edge condition on canvas instead'); r.names.forEach(n => tgts.push(n)) })
          if (last === 'set_downstream') link([src], tgts); else link(tgts, [src])
        }
      })

      // (v1.23, case_0177 live-verified) listvar assignments fully consumed by owned chain() expansions become
      // owned themselves: the expanded edges carry the wiring, and re-emitting the assignment verbatim can
      // NameError when it references group-member vars (group blocks render after carried DAG-body lines).
      // Guard: any unowned statement still referencing the variable keeps the assignment verbatim.
      expandedListVars.forEach(v => {
        const esc = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
        const assign = F.statements.find(st => new RegExp('^\\s*' + esc + '\\s*=').test(st.text))
        if (!assign || isOwned(assign)) return
        const dangling = F.statements.some(st => st !== assign && new RegExp('\\b' + esc + '\\b').test(st.text) && !isOwned(st))
        if (!dangling) ownStmt(assign.start)
      })

      // Group notification synthesis; nodes sorted by file position (import first-appearance order is stable)
      groups.forEach(g => { if (notifyOf[g.id] !== undefined) g.notify = { onMemberFailure: 'both', channel: notifyOf[g.id] } })
      // Group id dedupe (multi-DAG files redefine same-named groups; canvas/renderer key groups by id — example_task_loops double-accumulate learned)
      const seenG = new Set()
      const dedupGroups = []
      groups.forEach(g => {
        if (seenG.has(g.id)) { warnings.push('Duplicate group id ' + g.id + ' (multi-DAG or re-defined group); merged into the first definition'); return }
        seenG.add(g.id); dedupGroups.push(g)
      })
      nodes.sort((a, b) => a.__start - b.__start)
      // (v1.16l) _defInline dedup: an in-block @task def emits once, anchored to its earliest emitted
      // instantiation (nodes are position-sorted here); later instantiations of the same fn drop the key
      {
        const inlineSeen = new Set()
        nodes.forEach(n => {
          const v = n.params && n.params._defInline
          if (!v) return
          if (n.params._noCall === '1' || inlineSeen.has(v)) delete n.params._defInline
          else inlineSeen.add(v)
        })
        // safety net: an in-block fn instantiated ONLY via nested calls (noCall prototypes never emit) would lose
        // its def entirely — prepend it to the earliest statement whose callSrc references the fn, with a warning
        Object.keys(taskFns).forEach(fn => {
          const t = taskFns[fn]
          if (!t.inBlock) return
          if (nodes.some(n => n.params && n.params._defInline === t.defSrc)) return
          const host = nodes.find(n => n.params && typeof n.params._callSrc === 'string' && new RegExp('\\b' + fn + '\\s*\\(').test(n.params._callSrc))
          if (host) {
            host.params._defInline = host.params._defInline ? t.defSrc + '\n' + host.params._defInline : t.defSrc
            warnings.push('@task def ' + fn + ' is scope-bound and instantiated only as a nested call — its def was anchored before the referencing statement; verify ordering manually')
          } else {
            warnings.push('@task def ' + fn + ' is scope-bound but no instantiation statement was found — its def was NOT emitted; re-declare manually')
          }
        })
      }

      // (v1.17) never-emitted registered defs ride verbatim (shared by scope carry + module sweep): a def
      // whose defSrc/defInline reached no node (referenced only by verbatim-carried code — parameterized
      // @task_group bodies, setup/teardown context blocks) must not be owned away; the unowned-run carry
      // restores it in place (P1: nothing vanishes)
      const emittedDefSrc = new Set()
      nodes.forEach(n => {
        if (!n.params) return
        if (typeof n.params._defSrc === 'string' && n.params._defSrc) emittedDefSrc.add(n.params._defSrc)
        if (typeof n.params._defInline === 'string' && n.params._defInline) emittedDefSrc.add(n.params._defInline)
      })
      const defEmitted = t => [...emittedDefSrc].some(s => s.includes(t.defSrc))

      // Unowned in-scope content carry (v1.16e): contiguous line runs inside the DAG construction scope that no
      // node/edge/group/task-def owns — constants, helper defs, control-flow scaffolding, comments —
      // ride _preLines on the next structural anchor (ungrouped node / group) or dag._postLines at the tail,
      // so preview edits and source scaffolding survive emission↔reparse verbatim (P1: nothing silently dropped)
      const scope = dagSrc && dagWith ? [dagWith.bodyStart, dagWith.bodyEnd] : dagDefForScope ? [dagDefForScope.bodyStart, dagDefForScope.bodyEnd] : null
      if (scope) {
        const lines = text.split('\n')
        const lineStartOf = []
        { let off = 0; lines.forEach((l, i) => { lineStartOf[i] = off; off += l.length + 1 }) }
        const lineOf = pos => { let lo = 0, hi = lineStartOf.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (lineStartOf[mid] <= pos) lo = mid; else hi = mid - 1 } return lo }
        const firstL = lineOf(scope[0]), lastL = lineOf(Math.max(scope[0], scope[1] - 1))
        const owned = new Array(lastL - firstL + 1).fill(false)
        const ownRange = (s, e) => { const a = Math.max(firstL, lineOf(s)), b = Math.min(lastL, lineOf(Math.max(s, e - 1))); for (let i = a; i <= b; i++) owned[i - firstL] = true }
        ownedStmts.forEach(r => ownRange(r[0], r[1]))
        tgWiths.forEach(w => ownRange(w.start, w.bodyEnd))
        // (v1.17) never-emitted defs ride verbatim via the unowned-run carry (shared defEmitted, hoisted above);
        // only defs physically inside the scope are decided here — module-level ones fall to the module sweep
        F.defs.forEach(d => {
          if (!registeredDefs.has(d)) return
          const t = taskFns[d.name]
          if (t && t.rec === d && !defEmitted(t) && d.start >= scope[0] && d.start < scope[1]) {
            warnings.push('@task def ' + d.name + ' is never instantiated at DAG construction scope (referenced only by verbatim-carried code) — the def rides verbatim')
            return
          }
          ownRange(d.decoStart ?? d.start, d.bodyEnd)
        })
        // structural anchors in position order: ungrouped nodes (their statement start) + groups (with-block / factory-def start)
        const anchors = []
        nodes.forEach(n => { if (!n.group) { const st = stmtOf(n.__start); anchors.push({ pos: st ? st.start : n.__start, node: n }) } })
        tgWiths.forEach(w => { const g = dedupGroups.find(x => x.id === w.__gid); if (g) anchors.push({ pos: w.start, grp: g }) })
        Object.values(tgFns).forEach(d => { const g = dedupGroups.find(x => x.id === d.__gid); if (g) anchors.push({ pos: d.decoStart ?? d.start, grp: g }) })
        anchors.sort((a, b) => a.pos - b.pos)
        let i = firstL
        while (i <= lastL) {
          if (owned[i - firstL]) { i++; continue }
          let j = i
          while (j + 1 <= lastL && !owned[j + 1 - firstL]) j++
          let a = i, b = j // trim blank edges of the run; all-blank runs are not carried (normalization drops them anyway)
          const blank = li => !lines[li].trim()
          while (a <= b && blank(a)) a++
          while (b >= a && blank(b)) b--
          if (a <= b) {
            // Block-header safety: a control-flow header (for/with/if/try…) whose block is only partially owned
            // cannot be carried — carrying the header alone amputates the block (IndentationError on reparse,
            // example_setup_teardown_taskflow / example_task_group_decorator learned). The header and the unowned
            // remainder of its block drop with a warning; owned content emits via the normal machinery.
            // (v1.16l) block end = last non-blank line indented deeper than the header — trailing blank lines never
            // extend a block (the old be-scan overshot past blanks and dropped standalone helper defs:
            // example_outlet_event_extra's post_execute def / example_asset_alias_with_no_taskflow learned)
            const drop = new Set()
            for (let h = a; h <= b; h++) {
              const l = lines[h]
              if (!l.trim() || /^[ \t]*#/.test(l) || !/:\s*$/.test(l)) continue
              const hInd = /^[ \t]*/.exec(l)[0].length
              let blockLast = h
              for (let k = h + 1; k <= lastL; k++) {
                const l2 = lines[k]
                if (!l2.trim()) continue
                if (/^[ \t]*/.exec(l2)[0].length > hInd) blockLast = k
                else break
              }
              let mixed = blockLast > b
              if (!mixed) for (let k = h + 1; k <= blockLast; k++) if (owned[k - firstL]) { mixed = true; break }
              if (mixed) {
                warnings.push('Control-flow construct not carried verbatim: ' + l.trim().slice(0, 60) + ' — its body holds task/group constructs emitted in normalized positions; wrapper semantics (loop iteration / context-manager setup-teardown) are not restored, re-declare manually if needed')
                drop.add(h)
                for (let k = h + 1; k <= blockLast && k <= b; k++) if (!owned[k - firstL]) drop.add(k)
              }
            }
            const flush = (s0, e0) => {
              if (s0 < 0 || e0 < s0) return
              let a2 = s0, b2 = e0
              while (a2 <= b2 && blank(a2)) a2++
              while (b2 >= a2 && blank(b2)) b2--
              if (a2 > b2) return
              const minInd = Math.min(...lines.slice(a2, b2 + 1).filter(l => l.trim()).map(l => /^[ \t]*/.exec(l)[0].length))
              const body = lines.slice(a2, b2 + 1).map(l2 => l2.slice(Math.min(minInd, /^[ \t]*/.exec(l2)[0].length))).join('\n').replace(/[ \t]+$/gm, '')
              const anchor = anchors.find(x => x.pos >= lineStartOf[b2])
              if (anchor) {
                const target = anchor.node ? anchor.node.params : (anchor.grp.attrs = anchor.grp.attrs || {})
                target._preLines = target._preLines ? target._preLines + '\n' + body : body
              } else {
                dag = dag || { id: 'flow', schedule: '' }
                dag._postLines = dag._postLines ? dag._postLines + '\n' + body : body
              }
            }
            let segStart = -1
            for (let k = a; k <= b; k++) {
              if (drop.has(k)) { flush(segStart, k - 1); segStart = -1; continue }
              if (segStart < 0) segStart = k
            }
            flush(segStart, b)
          }
          i = j + 1
        }
      }

      // Module-level carry (v1.16g): unowned top-level runs — extra imports (Asset/textwrap/typing),
      // helper defs/constants, license/docstring comments, __main__ blocks — ride dag._modLines (before the
      // DAG construction) / dag._tailLines (after it) verbatim, emitted by the skeleton around the with-block.
      // Owned here: machinery-consumed statements, taskflow/group def blocks (re-emitted via _defSrc),
      // @dag def blocks + their module-level invocations (with-form conversion self-registers),
      // the DAG construction statement. Generated header imports de-duplicate carried import lines by text.
      {
        const linesM = text.split('\n')
        const lsM = []
        { let off = 0; linesM.forEach((l, i) => { lsM[i] = off; off += l.length + 1 }) }
        const lineOfM = pos => { let lo = 0, hi = lsM.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (lsM[mid] <= pos) lo = mid; else hi = mid - 1 } return lo }
        const mOwned = new Array(linesM.length).fill(false)
        const mOwn = (s, e) => { const a = Math.max(0, lineOfM(s)), b = Math.min(linesM.length - 1, lineOfM(Math.max(s, e - 1))); for (let k = a; k <= b; k++) mOwned[k] = true }
        // (v1.16m) module docstring hoist: __doc__ binds only when the docstring is the FIRST statement —
        // carried via _modLines it lands after skeleton imports, demoting it to a no-op expression and
        // breaking __doc__ consumers (example_params_trigger_ui: description=__doc__.partition('.')[0] →
        // AttributeError on None). Detect the head docstring (comments/blanks may precede; f-strings are
        // never docstrings) and emit it verbatim right after the Generated comment line.
        const headDocM = text.match(/^((?:[ \t]*#[^\n]*\n|[ \t]*\n)*)([rRbBuU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'))[ \t]*(?:\n|$)/)
        if (headDocM) {
          const ds = headDocM[1].length
          dag = dag || { id: 'flow', schedule: '' }
          dag._modDoc = headDocM[2]
          mOwn(ds, ds + headDocM[2].length)
        }
        // (v1.16m/v1.17) never-emitted registered @task defs ride verbatim (shared defEmitted, hoisted above
        // the scope carry) — otherwise owned here AND never re-emitted → the def silently vanishes and a
        // verbatim-carried caller crashes with NameError (example_task_group_decorator's task_1/2/3 learned).
        // In-scope defs are handled (and warned) by the scope carry; module-level ones are warned here.
        ownedStmts.forEach(r => mOwn(r[0], r[1]))
        tgWiths.forEach(w => mOwn(w.start, w.bodyEnd))
        F.defs.forEach(d => {
          if (registeredDefs.has(d)) {
            const t = taskFns[d.name]
            if (t && t.rec === d && !defEmitted(t)) {
              if (!dagWith || d.start < dagWith.bodyStart || d.start >= dagWith.bodyEnd)
                warnings.push('@task def ' + d.name + ' is never instantiated at DAG construction scope (referenced only by verbatim-carried code) — the def rides verbatim at module level')
              return // unowned → module-level sweep carries it verbatim below
            }
            mOwn(d.decoStart ?? d.start, d.bodyEnd); return
          }
          if (d === dagDefForScope) mOwn(d.decoStart ?? d.start, d.bodyEnd) // converted @dag def: structurally re-emitted; non-converted DAG defs ride verbatim
        })
        if (dagWith) mOwn(dagWith.start, dagWith.bodyEnd)
        if (dagCall && !dagWithsAll.length) { const st = stmtOf(dagCall.start); if (st) mOwn(st.start, st.end) } // assignment form only; with/mixed forms carry the DAG() call inside their with block as a whole
        const genImports = new Set(['from airflow.sdk import DAG', 'import datetime as _dq_dt'])
        nodes.forEach(n => {
          if (n.params && n.params._tf === '1') { if (n.params._defImport) genImports.add(n.params._defImport) }
          else { const oc = n.op || ''; const dot = oc.lastIndexOf('.'); if (dot >= 0) genImports.add('from ' + oc.slice(0, dot) + ' import ' + oc.slice(dot + 1)) }
        })
        if (dedupGroups.length) genImports.add('from airflow.sdk import TaskGroup')
        if (notifyIds.size) genImports.add('from airflow.providers.smtp.operators.smtp import EmailOperator')
        const scopeEnd = dagWith ? dagWith.bodyEnd : dagDefForScope ? dagDefForScope.bodyEnd : dagCall ? dagCall.end : -1
        const modLines = [], tailLines = [], futureLines = []
        const seenImport = new Set()
        let mi = 0
        while (mi < linesM.length) {
          if (mOwned[mi]) { mi++; continue }
          let mj = mi
          while (mj + 1 < linesM.length && !mOwned[mj + 1]) mj++
          // block-header partial-ownership guard: a header whose block holds owned lines cannot ride (amputation).
          // (v1.16l) block end = last non-blank line indented deeper than the header — trailing blank lines never
          // extend a block (the old be-scan overshot past blanks and misclassified standalone helper defs as mixed)
          const dropM = new Set()
          for (let h = mi; h <= mj; h++) {
            const l = linesM[h]
            if (!l.trim() || /^[ \t]*#/.test(l) || !/:\s*$/.test(l)) continue
            let blockLast = h
            for (let k = h + 1; k < linesM.length; k++) {
              const l2 = linesM[k]
              if (!l2.trim()) continue
              if (/^[ \t]*/.exec(l2)[0].length > 0) blockLast = k
              else break
            }
            let mixed = blockLast > mj
            if (!mixed) for (let k = h + 1; k <= blockLast; k++) if (mOwned[k]) { mixed = true; break }
            if (mixed) {
              const ownedIn = []
              for (let k = h + 1; k <= blockLast; k++) if (mOwned[k]) ownedIn.push(k + 1)
              warnings.push('Module-level construct not carried verbatim: ' + l.trim().slice(0, 60) + ' — its body holds task/group constructs emitted in normalized positions (owned lines: ' + ownedIn.join(',') + '); wrapper semantics not restored, re-declare manually if needed')
              dropM.add(h)
              for (let k = h + 1; k <= blockLast && k <= mj; k++) if (!mOwned[k]) dropM.add(k)
            }
          }
          for (let k = mi; k <= mj; k++) {
            if (dropM.has(k)) continue
            const raw = linesM[k].replace(/[ \t]+$/gm, '')
            const t = raw.trim()
            if (!t) continue
            if (/^# Generated from dq-platform IR/.test(t)) continue // our own skeleton marker — never carried (af-01 round-trip learned)
            if (/^from __future__ import /.test(t)) { if (!futureLines.includes(t)) futureLines.push(t); continue } // __future__ must lead the file
            if (/^(?:import \S|from \S+ import )/.test(t)) {
              if (genImports.has(t) || seenImport.has(t)) continue
              // (v1.21) name-level merge against generated imports: a source line like
              // `from airflow.sdk import Asset, dag, task` is NOT string-equal to the generated
              // `from airflow.sdk import task`, so both were emitted (astro exampledag learned: duplicate
              // binding). Covered names are stripped; a partially covered line is rewritten with the
              // remaining names (line position preserved); a fully covered line is dropped.
              const fm = /^from\s+(\S+)\s+import\s+(.+)$/.exec(t)
              if (fm && fm[2].indexOf('(') < 0) {
                const covered = new Set()
                genImports.forEach(g => {
                  const gm = /^from\s+(\S+)\s+import\s+(.+)$/.exec(g)
                  if (gm && gm[1] === fm[1]) gm[2].split(',').forEach(x => covered.add(x.trim()))
                })
                const names = fm[2].split(',').map(x => x.trim()).filter(Boolean)
                const keep = names.filter(n => !covered.has(n))
                if (!keep.length) continue
                if (keep.length < names.length) {
                  const rewritten = 'from ' + fm[1] + ' import ' + keep.join(', ')
                  if (seenImport.has(rewritten)) continue
                  seenImport.add(rewritten)
                  ;(lsM[k] >= scopeEnd ? tailLines : modLines).push(rewritten)
                  continue
                }
              }
              seenImport.add(t)
            }
            ;(lsM[k] >= scopeEnd ? tailLines : modLines).push(raw)
          }
          mi = mj + 1
        }
        if (modLines.length || tailLines.length || futureLines.length) {
          dag = dag || { id: 'flow', schedule: '' }
          if (modLines.length) dag._modLines = modLines.join('\n')
          if (tailLines.length) dag._tailLines = tailLines.join('\n')
          if (futureLines.length) dag._modFuture = futureLines.join('\n')
        }
      }

      nodes.forEach(n => { delete n.__start })

      // (v1.17) chain-operand setup/teardown modifiers ride the DAG tail verbatim (after all instantiations
      // so the referenced bind names exist): task_3.as_teardown(setups=task_1) — runtime marks the task
      // teardown and reproduces the implicit setup→teardown wiring
      if (modifierLines.length) {
        dag = dag || { id: 'flow', schedule: '' }
        dag._postLines = dag._postLines ? dag._postLines + '\n' + modifierLines.join('\n') : modifierLines.join('\n')
      }

      // (v1.16l) verbatim-only file: nothing converted, nothing registered — the skeleton must NOT emit
      // an empty with-DAG shell (example_dag_decorator learned: an empty `with DAG(...):` body is an
      // IndentationError). Everything already rides via _tailLines/_modLines; mark so the template
      // suppresses the DAG block entirely.
      if (!nodes.length && !converted) {
        dag = dag || { id: 'flow', schedule: '' }
        dag._verbatimOnly = '1'
      }

      return {
        nodes, edges,
        dag: dag || undefined,
        groups: dedupGroups.length ? dedupGroups : undefined,
        warnings: warnings.length ? warnings : undefined,
      }
    }

  # Submit contract (v1.14): the Submit button's form and request are defined here, executed in the browser.
  submitJs: |
    return {
      description: 'Push the DAG file to an Airflow REST ingest endpoint (identity passthrough; no service accounts)',
      fields: {
        endpoint: { type: 'string', title: 'API Base URL', required: true, default: 'http://localhost:8080/api/v1' },
        method: { type: 'enum', title: 'HTTP Method', options: ['POST', 'PUT'], default: 'POST' },
        credRef: { type: 'reference', title: 'Credential Ref', options: ['vault://cred/airflow-prod', 'vault://cred/airflow-staging'] },
        withCredentials: { type: 'boolean', title: 'Send cookies (credentials: include)' },
      },
      buildRequest: (fields, artifact) => ({
        url: String(fields.endpoint || '').replace(/\/+$/, '') + '/dags/import',
        init: {
          method: fields.method || 'POST',
          headers: { 'Content-Type': 'text/plain', 'X-Credential-Ref': fields.credRef || '' },
          body: artifact,
          ...(fields.withCredentials === 'true' ? { credentials: 'include' } : {}),
        },
      }),
    }

---
# ============ Wildcard placeholder (v1.10): fallback type for unregistered operator families ============
# Readback op FQN matches this type by glob (exact > short name > match > raw_* synthesis);
# On match the instance carries the actual op (opOverride) — emission and canvas opText follow the instance value; this definition is only a shell (form/color/semantics).
# Inherent limitations surfaced: no form schema (config page renders no fields), paramRender format declarations lost (pyref-like params may get quoted).
apiVersion: dq.platform/flow-meta/v1
kind: FlowNodeType
metadata: { name: ProviderWildcard, version: 1 }
spec:
  invocation: atomic
  managed: true
  color: slate
  category: Airflow/Wildcard
  description: Wildcard placeholder: covers unregistered airflow.providers.* operators; on match the instance keeps its actual op FQN, emitted verbatim
  match: airflow.providers.*
  form: {}
