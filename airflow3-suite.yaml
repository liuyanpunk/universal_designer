apiVersion: dq.platform/flow-meta/v1
kind: FlowDialectTemplate
metadata: { name: airflow-3x-skeleton, target: airflow, targetVersions: ["3.0", "3.1", "3.2"], version: 6 }
spec:
  groupEdgeRewrite: false     # (v1.23, 500-case Airflow live-verified) task-level edges KEEP task endpoints across
                              # group boundaries — Airflow runtime wires plain task>>task verbatim; lifting to group
                              # ids and re-emitting `g1 >> g2` re-expands as leaves×roots at render time, which
                              # fabricates edges/self-loops/cycles (case_0239 et al). Only edges whose source text
                              # literally references a group variable carry group endpoints (parserJs resolve()),
                              # and those render back as group syntax — faithful by construction.
  groupIndentExtra: 4        # TaskGroup with-block body indented 4 deeper than top level
  validation: |              # local validation rules (v1.7): executed in the page browser, truthy = pass
    - id: bash-command-nonempty
      level: error
      matchOp: airflow.providers.standard.operators.bash.BashOperator
      message: BashOperator requires bash_command (command must not be empty)
      assert: String(node.params.bash_command || '').trim().length > 0
    - id: python-callable-nonempty
      level: error
      matchOp: airflow.providers.standard.operators.python.PythonOperator
      message: PythonOperator requires python_callable (callable reference)
      assert: String(node.params.python_callable || '').trim().length > 0
    - id: sql-column-check-mapping-nonempty
      level: error
      matchOp: airflow.providers.common.sql.operators.sql.SQLColumnCheckOperator
      message: SQLColumnCheckOperator requires column_mapping (dict of column checks, e.g. {"c": {"null_check": {"eq_to": 0}}})
      assert: String(node.params.column_mapping || '').trim().length > 0
    - id: email-suggest-to
      level: warn
      matchOp: airflow.providers.smtp.operators.smtp.EmailOperator
      message: EmailOperator should declare recipients (to) explicitly, otherwise it surfaces only at runtime
      assert: String(node.params.to || '').trim().length > 0
    - id: trigger-rule-branch-upstream
      level: warn
      message: trigger_rule all_success/all_failed with a branching upstream can cascade-skip or deadlock — verify branch coverage (dags.html trigger rules)
      assert: !node.params.trigger_rule || ['all_success', 'all_failed'].indexOf(String(node.params.trigger_rule)) < 0 || !graph.edges.some(e => e.to === node.id && /(Branch|\.branch|LatestOnly)/.test(((graph.nodes.find(n => n.id === e.from) || {}).op) || ''))
    - id: taskflow-call-present
      level: error
      matchOp: airflow.taskflow
      message: TaskFlow node requires an Invocation line (e.g. my_task() or result = my_task(1))
      assert: /\w+\s*(\(|=)/.test(String(node.params._callSrc || '')) || String(node.params._noCall || '') === '1'
    - id: taskflow-def-carried
      level: warn
      matchOp: airflow.taskflow
      message: No function definition carried on this node (may be shared with a sibling instantiation — otherwise add the @task def to Function Definition)
      assert: String(node.params._defSrc || node.params._defInline || '').indexOf('def ') >= 0 || String(node.params._noCall || '') === '1'
  importRender: |
    {{#if-eq node.params._tf "1"}}
    {{ node.params._defImport }}
    {{else}}
    {{#if-eq node.opModule ""}}
    {{else}}
    from {{ node.opModule }} import {{ node.opName }}
    {{/if-eq}}
    {{/if-eq}}
  paramRender: "        {{ key }}={{ value | pyval }},"
  edgeRender: |
    {{#if-eq edge.attrs.implicit "1"}}
    {{else}}
    {{#if-eq edge.attrs.condition ""}}
        {{ edge.from }} >> {{ edge.to }}
    {{else}}
        {{ edge.from }} >> Label({{ edge.attrs.condition | pystr }}) >> {{ edge.to }}
    {{/if-eq}}
    {{/if-eq}}
  skeleton: |
    # Generated from dq-platform IR · template airflow-3x-skeleton v6 · Airflow 3.x (airflow.sdk)
    {{#if-eq dag._modDoc ""}}
    {{else}}
    {{ dag._modDoc }}
    {{/if-eq}}
    {{#if-eq dag._modFuture ""}}
    {{else}}
    {{ dag._modFuture }}
    {{/if-eq}}
    from airflow.sdk import DAG
    import datetime as _dq_dt
    {{ imports }}
    {{#each graph.edgeAttrKeys dedupe="true"}}
    {{#if-eq item "condition"}}
    from airflow.sdk import Label
    {{else}}
    {{/if-eq}}
    {{/each}}
    {{#each nodes dedupe="true"}}
    {{#if-eq item.params.outlets ""}}
    {{#if-eq item.params.inlets ""}}
    {{else}}
    from airflow.sdk import Asset
    {{/if-eq}}
    {{else}}
    from airflow.sdk import Asset
    {{/if-eq}}
    {{/each}}
    {{#if-eq dag._emit_asset_import "true"}}
    from airflow.sdk import Asset
    {{else}}
    {{/if-eq}}
    {{#each graph.groups dedupe="true"}}
    from airflow.sdk import TaskGroup
    {{/each}}
    {{#each graph.notifyGroups dedupe="true"}}
    from airflow.providers.smtp.operators.smtp import EmailOperator
    {{/each}}
    {{#if-eq dag._modLines ""}}
    {{else}}
    {{ dag._modLines }}
    {{/if-eq}}
    {{#each graph.defs dedupe="true"}}
    {{ item }}
    {{/each}}

    {{#if-eq dag._verbatimOnly "1"}}
    {{else}}
    {{#if-eq dag._idRaw ""}}
    {{#if-eq dag._argsTxt ""}}
    with DAG(dag_id={{ dag.id | pystr }}, schedule={{ dag._scheduleTxt }},
             start_date=_dq_dt.datetime(2026, 1, 1), catchup=False) as dag:
    {{else}}
    with DAG(dag_id={{ dag.id | pystr }}, schedule={{ dag._scheduleTxt }},
             {{ dag._argsTxt }}) as dag:
    {{/if-eq}}
    {{else}}
    {{#if-eq dag._argsTxt ""}}
    with DAG(dag_id={{ dag._idRaw }}, schedule={{ dag._scheduleTxt }},
             start_date=_dq_dt.datetime(2026, 1, 1), catchup=False) as dag:
    {{else}}
    with DAG(dag_id={{ dag._idRaw }}, schedule={{ dag._scheduleTxt }},
             {{ dag._argsTxt }}) as dag:
    {{/if-eq}}
    {{/if-eq}}
    {{ tasks }}
    {{#each graph.groups}}
    {{ item.block }}
    {{/each}}
    {{#each graph.notifyGroups}}
        {{ item.nid }} = EmailOperator(
            task_id={{ item.nid | pystr }},
            to={{ item.notify.channel | pystr }},
            subject="[dq] Group {{ item.id }} member failure: notify upstream/downstream",
            html_content="Group {{ item.id }} ({{ item.memberCount }} tasks) has member failure; upstream please check data quality, downstream please pause consumption",
            trigger_rule="one_failed",
        )
    {{/each}}
    {{ deps }}
        {{ dag._postLines }}
    {{#each graph.notifyGroups}}
        {{ item.ref }} >> {{ item.nid }}
    {{/each}}
    {{/if-eq}}
    {{#if-eq dag._tailLines ""}}
    {{else}}
    {{ dag._tailLines }}
    {{/if-eq}}
  # Group block markup (v1.17, nested-capable): flowmeta renders it RECURSIVELY — a child group's rendered
  # block rides its parent's tasks text, so nesting depth is unbounded. group.id is path-qualified
  # (section_2.inner_section_2); group.bare is the runtime group_id; group.varName is the with-as alias.
  groupRender: |
    {{#if-eq group.attrs._preLines ""}}
    {{else}}
        {{ group.attrs._preLines }}
    {{/if-eq}}
    {{#if-eq group.attrCount "0"}}
        with TaskGroup(group_id={{ group.bare | pystr }}) as {{ group.varName }}:
    {{else}}
        with TaskGroup(
            group_id={{ group.bare | pystr }},
    {{#if-eq group.attrs.tooltip ""}}
    {{else}}
            tooltip={{ group.attrs.tooltip | pystr }},
    {{/if-eq}}
    {{#if-eq group.attrs.prefix_group_id ""}}
    {{else}}
            prefix_group_id={{ group.attrs.prefix_group_id }},
    {{/if-eq}}
    {{#if-eq group.attrs.default_args ""}}
    {{else}}
            default_args={{ group.attrs.default_args }},
    {{/if-eq}}
    {{#if-eq group.attrs.doc_md ""}}
    {{else}}
            doc_md={{ group.attrs.doc_md | pystr }},
    {{/if-eq}}
        ) as {{ group.varName }}:
    {{/if-eq}}
    {{ group.tasks }}
    {{ group.deps }}
    {{#if-eq group.hasBody "false"}}
        pass
    {{/if-eq}}
  nodeRender: |
    {{#if-eq node.params._preLines ""}}
    {{else}}
        {{ node.params._preLines }}
    {{/if-eq}}
    {{#if-eq node.params._defInline ""}}
    {{else}}
        {{ node.params._defInline }}
    {{/if-eq}}
    {{#if-eq node.params._tf "1"}}
    {{#if-eq node.params._noCall "1"}}
    {{else}}
    {{#if-eq node.bindAs ""}}
        {{ node.params._callSrc }}
    {{else}}
        {{ node.bindAs }} = {{ node.params._callSrc }}
    {{/if-eq}}
    {{/if-eq}}
    {{else}}
        {{ node.bindName }} = {{ node.opClass | pyname }}(
            task_id={{ node.bareId | pystr }},
    {{ paramLines }}
    {{#if-eq node.params._setup_teardown "setup"}}
        ){{ node.params._opSuffix }}.as_setup()
    {{else}}
    {{#if-eq node.params._setup_teardown "teardown"}}
        ){{ node.params._opSuffix }}.as_teardown()
    {{else}}
        ){{ node.params._opSuffix }}
    {{/if-eq}}
    {{/if-eq}}
    {{/if-eq}}
  # Readback parsing = this JavaScript block (owner decision 2026-10-11: py dialect parsing is defined
  # by the YAML author as embedded JS, executed entirely in the user's browser, zero backend; the engine only provides py mechanical-layer utilities and type-mapping post-processing).
  # Covered constructs: classic assignment/bare calls (single-line/multi-line paren blocks), @task/@dag decorators, with DAG / DAG(),
  # TaskGroup groups (nested: innermost membership), chain >>/<< ([a,b] fan-out/fan-in, list-variable expansion, Label mapped to edge condition),
  # chain()/chain_linear(), set_downstream/set_upstream, taskflow data-flow edges,
  # EmailOperator(trigger_rule="one_failed") outside a group = group notification (no node generated).
  # Unparseable dynamic constructs (e.g. list(dag.tasks) >> watcher()) go to warnings — never silent (P1).
  parserJs: |
    function parse(text, py) {
      const F = py.analyze(text)
      const warnings = []
      const nodes = [], edges = [], groups = []
      const byVar = {}, nodeIds = {}, groupIds = {}, groupVars = {}
      const taskFns = {}, fnCnt = {}
      const registeredDefs = new Set() // v1.16i: identity set — ownership marks by def OBJECT identity, not name (example_task_loops learned: same-named increment def nested + module-level double def mis-owned by name)
      const notifyOf = {}, notifyIds = new Set()
      const modifierLines = [] // v1.17: .as_setup()/.as_teardown(...) modifiers on chain operands ride verbatim, re-emitted at the DAG tail

      // (v1.17) variable bindings are POSITION-SCOPED: Python with-blocks do not create scope, so a later
      // same-named assignment shadows the earlier one (task_1 in section_1 vs section_2 — example_task_group
      // learned: naive last-wins byVar wired section_1's internal chain to section_2's tasks). byVar stores
      // an ordered bind list per name; resolution picks the latest bind at or before the referencing position.
